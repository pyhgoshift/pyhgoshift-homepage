hes 128K only by YaRN extension. Four KV heads keep the cache small, so the window is affordable: at Q4_K_M it fits a 4 GB card at short context and an 8 GB card at its full trained window. That also makes it one of the few models here that is realistic on a CPU-only machine. Sizes use the calculator's generic rates, since no GGUF file size could be checked, and no per-level quality loss has been published.","zh":"Hugging Face 完全开源的 3B 模型，训练数据和训练方法随权重一起公开。它带一个可开关的推理模式，实际训练到的上下文窗口是 64K，128K 要靠 YaRN 外推。只有 4 个 KV 头，缓存很小，所以长窗口也负担得起：Q4_K_M 下短上下文能放进 4 GB 显卡，用满训练窗口也能放进 8 GB 显卡。这也让它成为本站少数在纯 CPU 机器上也现实可用的模型之一。下方体积使用计算器的通用比特率，因为未能核对到 GGUF 文件大小，各档位的质量损失也未公布。"},"quants":[{"format":"GGUF","level":"Q4_K_M","bpw":4.85,"vramGB":2.3,"hfSearchUrl":"https://huggingface.co/models?search=SmolLM3-3B%20GGUF%20Q4_K_M","confidence":"estimated"},{"format":"GGUF","level":"Q8_0","bpw":8.5,"vramGB":3.7,"hfSearchUrl":"https://huggingface.co/models?search=SmolLM3-3B%20GGUF%20Q8_0","confidence":"estimated"}]},{"id":"ernie-4.5-21b-a3b","name":"ERNIE 4.5 21B-A3B","family":"Baidu ERNIE 4.5","params":21.8,"paramLabel":"21B-A3B","categories":["general","instruct"],"hardwareTags":["consumer-gpu","mac"],"contextLength":131072,"arch":{"layers":28,"attHeads":20,"kvHeads":4,"headDim":128},"addedAt":"2026-10-03","description":{"en":"Baidu's open mixture-of-experts model: about 21.8B parameters in total and roughly 3B active per token. Each token goes through 6 of 64 routed experts plus 2 shared ones. The total decides the memory and the active count decides the speed, so it needs the VRAM of a 20B-class model and reads about as much per token as a 3B one. At Q4_K_M it needs about 14.1 GB at 4K context, which is right at the edge of comfortable on a 16 GB card and tight by 32K. A 24 GB card, or a 24 GB Mac through the GPU's share of unified memory, leaves real room for context. Sizes use the calculator's generic rates, since no GGUF file size could be checked, and no per-level quality loss has been published.","zh":"百度开源的混合专家模型：总参数约 21.8B，每个 token 约激活 3B，由 64 个路由专家（每个 token 选 6 个）加 2 个共享专家组成。总参数决定显存，激活参数决定速度，所以它需要 20B 级模型的显存，每个 token 读取的数据量却和 3B 模型差不多。Q4_K_M 在 4K 上下文下约需 14.1 GB，在 16 GB 显卡上正好处于“宽裕”的边缘，到 32K 就偏紧了；24 GB 显卡，或 24 GB 的 Mac（靠 GPU 可用的那部分统一内存）才有真正的上下文余量。下方体积使用计算器的通用比特率，因为未能核对到 GGUF 文件大小，各档位的质量损失也未公布。"},"quants":[{"format":"GGUF","level":"Q4_K_M","bpw":4.85,"vramGB":14.1,"hfSearchUrl":"https://huggingface.co/models?search=ERNIE-4.5-21B-A3B%20GGUF%20Q4_K_M","confidence":"estimated"},{"format":"GGUF","level":"Q8_0","bpw":8.5,"vramGB":24.4,"hfSearchUrl":"https://huggingface.co/models?search=ERNIE-4.5-21B-A3B%20GGUF%20Q8_0","confidence":"estimated"}]},{"id":"olmo-3-7b","name":"OLMo 3 7B Instruct","family":"Allen AI OLMo","params":7.3,"paramLabel":"7B","categories":["general","instruct"],"hardwareTags":["consumer-gpu","mac","cpu-vps"],"contextLength":65536,"arch":{"layers":32,"attHeads":32,"kvHeads":32,"headDim":128,"attention":{"fullLayers":8,"windowLayers":24,"windowTokens":4608}},"addedAt":"2026-10-05","description":{"en":"Allen AI's fully open 7B model, released with its training data, code and intermediate checkpoints. Its predecessor stopped at a 4K context; OLMo 3 reaches 64K, extended from an 8K base by YaRN. Three of every four layers use a 4K sliding window, which is what makes that affordable. It still uses full multi-head attention with no shared KV heads, so long context costs more here than on most 7B–8B models. At Q4_K_M it needs about 6.8 GB at 4K context and 10.9 GB at 32K. Without the sliding window, 32K would need about 22 GB. Sizes use the calculator's generic rates, since no GGUF file size could be checked, and no per-level quality loss has been published.","zh":"Allen AI 完全开源的 7B 模型，训练数据、代码和中间检查点一并公开。上一代只有 4K 上下文，OLMo 3 达到 64K（由 8K 基础通过 YaRN 扩展而来）。每四层中有三层使用 4K 滑动窗口，这正是长上下文负担得起的原因。不过它仍是完整的多头注意力，没有共享 KV 头，所以长上下文的代价比大多数 7B–8B 模型高。Q4_K_M 在 4K 上下文下约需 6.8 GB，32K 下约 10.9 GB；如果没有滑动窗口，32K 需要约 22 GB。下方体积使用计算器的通用比特率，因为未能核对到 GGUF 文件大小，各档位的质量损失也未公布。"},"quants":[{"format":"GGUF","level":"Q4_K_M","bpw":4.85,"vramGB":6.8,"hfSearchUrl":"https://huggingface.co/models?search=Olmo-3-7B-Instruct%20GGUF%20Q4_K_M","confidence":"estimated"},{"format":"GGUF","level":"Q8_0","bpw":8.5,"vramGB":10.3,"hfSearchUrl":"https://huggingface.co/models?search=Olmo-3-7B-Instruct%20GGUF%20Q8_0","confidence":"estimated"}]},{"id":"muse-glimmer-30b","name":"Muse Glimmer 30B","family":"Meta Muse","params":27.85,"paramLabel":"30B","categories":["general","instruct","code","multimodal"],"hardwareTags":["consumer-gpu","mac"],"contextLength":131072,"arch":{"layers":52,"attHeads":32,"kvHeads":2,"headDim":128,"attention":{"fullLayers":13,"windowLayers":39,"windowTokens":2560}},"addedAt":"2026-10-09","description":{"en":"Meta's first open-weight model since Llama 4, released in August under Apache 2.0 and built to run on one card. It is a dense model: a 28B text decoder that reads images through a separate vision encoder and answers in text. Three of every four layers use a 2K sliding window and the rest share just 2 KV heads, so long context is unusually cheap. At Q4_K_M it needs about 17.7 GB at 4K context and only 19.4 GB at its full 128K window, comfortable on a 24 GB card either way. Q5_K_M is tight on 24 GB, and Q8_0 wants a 32 GB card. The vision encoder (about 1.4 GB as a GGUF mmproj file) and Meta's optional speculative-decoding drafter load on top and are not included. Sizes come from the published GGUF file sizes; the Q4_K_M row is Meta's own official build. Meta's benchmark claims are its own, and no per-level quality loss has been published.","zh":"Meta 自 Llama 4 以来第一个开放权重模型，8 月以 Apache 2.0 发布，目标就是单卡运行。它是稠密模型：28B 的文本解码器，通过单独的视觉编码器读取图像，输出文本。每四层中有三层使用 2K 滑动窗口，其余层只有 2 个 KV 头，所以长上下文格外便宜。Q4_K_M 在 4K 上下文下约需 17.7 GB，用满 128K 窗口也只要 19.4 GB，两种情况在 24 GB 显卡上都很宽裕。Q5_K_M 在 24 GB 上偏紧，Q8_0 需要 32 GB 显卡。视觉编码器（GGUF mmproj 文件约 1.4 GB）和 Meta 可选的投机解码草稿模型会额外占用显存，不含在上述数字内。体积按已公布的 GGUF 文件大小计算，Q4_K_M 一行是 Meta 官方发布的版本。基准成绩是 Meta 自己报的，各档位的质量损失也未公布。"},"quants":[{"format": 要占磁盘空间，而且打包在 GGUF 文件里，所以文件比下面的数字大得多。48 层中只有 12 层保留会增长的 KV 缓存，即使用满 256K 窗口也只多约 7.5 GB。Q4_K_M 在 4K 上下文下约需 79 GB，256K 下约 87 GB，128 GB 的 Mac 或 DGX Spark 能从容运行。单张 24 或 32 GB 显卡只有把专家卸载到系统内存才能跑。llama.cpp 以 \`qwen4exp\` 架构支持它。下方体积使用计算器的通用比特率（没有哪个文件大小能把模型本身和查找表分开），各档位的质量损失也未公布。"},"quants":[{"format":"GGUF","level":"Q4_K_M","bpw":4.85,"vramGB":79.3,"hfSearchUrl":"https://huggingface.co/models?search=Qwen3.8-Flash-Next%20GGUF","confidence":"estimated"},{"format":"GGUF","level":"Q8_0","bpw":8.5,"vramGB":138.9,"hfSearchUrl":"https://huggingface.co/models?search=Qwen3.8-Flash-Next%20GGUF%20Q8_0","confidence":"estimated"}]},{"id":"qwen3-6-35b-a3b","name":"Qwen3.6 35B-A3B","family":"Alibaba Qwen3.6","params":35.59,"paramLabel":"35B-A3B","categories":["general","instruct","code","multimodal"],"hardwareTags":["consumer-gpu","pro-gpu","mac"],"contextLength":262144,"arch":{"layers":40,"attHeads":16,"kvHeads":2,"headDim":256,"attention":{"fullLayers":10,"note":{"en":"10 of 40 layers use full attention (full_attention_interval 4); the rest are Gated DeltaNet linear attention with a fixed recurrent state, so the KV cache grows at a quarter of the usual rate.","zh":"40 层中有 10 层是全注意力（full_attention_interval 为 4），其余是 Gated DeltaNet 线性注意力、只保留固定大小的循环状态，因此 KV 缓存的增长只有常规架构的四分之一。"}}},"addedAt":"2026-10-10","description":{"en":"One of the most recommended models for a 24 GB card this year: 35.6B parameters, about 3B active per token, so it reads per token about as much as a 3B model. Only 10 of its 40 layers keep a growing KV cache, so context is cheap: at Q4_K_M it needs about 23.4 GB at 4K and 24.0 GB at 32K. On this site's rule that is tight on a 24 GB card, not comfortable, because it counts a working buffer most guides leave out. A 32 GB card, or a 48 GB Mac through the GPU's share of unified memory, has real room. It reads images through a separate vision encoder. Sizes come from the published GGUF file sizes, and no per-level quality loss has been published.","zh":"今年被推荐最多的 24 GB 显卡模型之一：总参数 e layer in seven grows a cache with context. Keys are 192 wide and values 128, sized here as their 160 average.","zh":"70 层中 10 层是全注意力，其余 60 层使用 128 token 滑动窗口（llama.cpp 保留窗口加一个 512 token 批次，补齐到 768），所以每七层只有一层的缓存随上下文增长。键宽 192、值宽 128，这里按平均 160 计算。"}}},"addedAt":"2026-10-12","description":{"en":"Xiaomi's open-weight flagship, near the top of the open-model rankings this autumn. It has about 1.02 trillion parameters, roughly 42B of them active per token, and ships under the MIT licence. The released weights are already 4-bit (MXFP4 experts), and the GGUF builds repack them rather than quantize again. At that level it needs about 604 GB at 4K context, more than any single machine in this index. The largest Mac Studio gives its GPU about 384 GB, and four 80 GB H100s hold 320 GB. Eight 80 GB cards (640 GB) are about the smallest server that holds it, and even that is tight on this site's rule. It is listed so the calculator can say so. Only 10 of its 70 layers keep a growing cache, so even 1M tokens adds only about 50 GB. llama.cpp runs it as \`mimo2\`, and vision loads through a separate encoder. Sizes come from a published GGUF file; no per-level quality loss has been published.","zh":"小米的开放权重旗舰，今年秋天位列开源模型排行榜前列：约 1.02 万亿参数，每个 token 激活约 42B，MIT 许可。发布的权重本身就是 4 比特（专家层为 MXFP4），GGUF 版本只是重新打包、没有再次量化。在这个档位下 4K 上下文约需 604 GB，超过本索引里任何一台单机：最大的 Mac Studio 给 GPU 的约 384 GB，四张 80 GB 的 H100 合计 320 GB。八张 80 GB 显卡（640 GB）大约是能装下它的最小服务器，按本站规则也只算「勉强」。收录它是为了让计算器能把这一点说清楚。70 层中只有 10 层保留会增长的缓存，所以即使 100 万 token 也只多约 50 GB。llama.cpp 以 \`mimo2\` 架构运行它，视觉通过单独的编码器加载。体积按已公布的 GGUF 文件计算，各档位的质量损失未公布。"},"quants":[{"format":"GGUF","level":"MXFP4","bpw":4.52,"vramGB":603.8,"pplLossPercent":0,"hfSearchUrl":"https://huggingface.co/models?search=MiMo-V2.6-Pro%20GGUF%20MXFP4","confidence":"estimated"}]},{"id":"mellum2-1-12b-a2-5b","name":"Mellum2.1 12B-A2.5B Thinking","family":"JetBrains Mellum","params":12.15,"paramLabel":"12B-A2.5B","categories":["code","instruct"],"hardwareTags":["consumer-gpu","mac"],"cont
