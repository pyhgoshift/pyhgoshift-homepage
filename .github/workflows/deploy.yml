name: PYHGOSHIFT Homepage CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build

      - name: Verify Docker Build (Optional Check)
        run: |
          docker build -t pyhgoshift-web:latest .

  deploy-to-server:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Notification
        run: |
          echo "CI Verification Passed. Ready to sync with server 192.168.64.31 via webhook or runner."
